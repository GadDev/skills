name: Label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply area labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label changed areas
        uses: actions/labeler@v5

name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create Version Pull Request
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset tag
          commit: "chore: version skills"
          title: "chore: version skills"
          # GH_TOKEN must be a PAT (classic or fine-grained with Contents + Pull Requests write).
          # GITHUB_TOKEN is blocked by the repo-level "Allow GitHub Actions to create or
          # approve pull requests" restriction; a PAT bypasses that limit.
          github-token: ${{ secrets.GH_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
